{% set name = "browserforge" %}
{% set version = "1.2.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/browserforge-{{ version }}.tar.gz
  sha256: 05686473793769856ebd3528c69071f5be0e511260993e8b2ba839863711a0c4

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - poetry-core >=1.0.0
    - pip
  run:
    - python >={{ python_min }}
    - click
    - apify_fingerprint_datapoints 
  run_constrained:
    - orjson *

test:
  imports:
    - browserforge
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/daijro/browserforge
  summary: Intelligent browser header & fingerprint generator
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thewchan
