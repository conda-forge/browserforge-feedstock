schema_version: 1

context:
  name: browserforge
  version: 1.2.4

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/browserforge-${{ version }}.tar.gz
  sha256: 05686473793769856ebd3528c69071f5be0e511260993e8b2ba839863711a0c4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core >=1.0.0
    - pip
  run:
    - python >=${{ python_min }}
    - click
    - apify_fingerprint_datapoints
  run_constraints:
    - orjson *

tests:
  - python:
      imports:
        - browserforge
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Intelligent browser header & fingerprint generator
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/daijro/browserforge

extra:
  recipe-maintainers:
    - thewchan
